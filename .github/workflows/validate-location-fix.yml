name: AWQAAT location fix validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-location-fix.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screenshot-match-main
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun (matching project's bun.lock)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install dependencies
        run: bun install
      - name: Run regression tests
        run: bun run test
      - name: Compile production website
        run: bun run build
