name: AWQAAT location fix validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-location-fix.yml'
      - 'screenshot-match-main/src/**'
      - 'screenshot-match-main/package.json'
      - 'screenshot-match-main/bun.lock'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screenshot-match-main
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bun (matching project's bun.lock)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install dependencies
        run: bun install
      - name: Run regression tests
        run: bun run test
      - name: Compile production website
        run: bun run build
      - name: Commit validated, synchronized Bun lockfile
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Synchronize Bun lockfile after validated build"
          encoded="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $encoded" push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:main
