name: Temporary Bun lock synchronization for push
on:
  push:
    branches:
      - feat/hijri-date-ios-qibla-prayer-push
    paths:
      - .github/workflows/sync-web-push-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: screenshot-match-main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.3'
      - name: Reconcile new dependency using project Bun version
        run: bun install
      - name: Commit updated lockfile to feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update locked dependencies for prayer push"
          encoded="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $encoded" push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:feat/hijri-date-ios-qibla-prayer-push
