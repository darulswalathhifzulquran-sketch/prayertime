name: JAMIA AWQAAT responsive viewport smoke tests
on:
  pull_request:
    paths:
      - 'screenshot-match-main/src/**'
      - 'screenshot-match-main/tests/responsive-layout.mjs'
      - '.github/workflows/responsive-viewport-smoke.yml'

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: screenshot-match-main
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run existing tests
        run: bun run test
      - name: Compile production app
        run: bun run build
      - name: Install Playwright for viewport validation
        run: |
          bun add --dev playwright@1.55.0
          bunx playwright install --with-deps chromium
      - name: Check all sections at ten mobile, iPad and desktop sizes
        shell: bash
        run: |
          set -euo pipefail
          bun run dev --host 127.0.0.1 --port 4173 > /tmp/jamia-vite.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173/" -o /dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS "http://127.0.0.1:4173/" -o /dev/null; then
            cat /tmp/jamia-vite.log
            exit 1
          fi
          bun tests/responsive-layout.mjs
