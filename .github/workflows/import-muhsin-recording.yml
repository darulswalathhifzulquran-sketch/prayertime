name: Import supplied MUHSIN azan into first-party assets
on:
  push:
    branches:
      - feat/second-muhsin-azan
    paths:
      - .github/workflows/import-muhsin-recording.yml
permissions:
  contents: write
jobs:
  import-recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout update branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/second-muhsin-azan
          persist-credentials: true
      - name: Download uploaded recording and verify exact SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshot-match-main/public/audio
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 180 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JYNl2hCPmpaieDc5ea98RVQw88/599eb9b9-3362-43f3-b94a-0403c5e46c62.mp3' \
            --output screenshot-match-main/public/audio/al-hafiz-muhammed-muhsin.mp3
          echo "2c1aac7f1be523b17f9eb28b41496220772462849c30eb68b11d27b5240f8486  screenshot-match-main/public/audio/al-hafiz-muhammed-muhsin.mp3" | sha256sum -c -
          test "$(wc -c < screenshot-match-main/public/audio/al-hafiz-muhammed-muhsin.mp3)" -eq 6086445
      - name: Commit exact recording to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshot-match-main/public/audio/al-hafiz-muhammed-muhsin.mp3
          git commit -m "Add supplied AL HAFIZ MUHAMMED MUHSIN azan recording"
          git push origin HEAD:feat/second-muhsin-azan
